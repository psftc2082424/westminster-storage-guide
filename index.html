<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Westminster Storage Guide</title>
  <meta name="description" content="Step-by-step guide for putting supplies away at Westminster Free Clinic.">
  <link rel="stylesheet" href="styles.css?v=20261111">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">
        <span class="brand-clinic">Westminster Free Clinic</span>
        <span class="brand-title">Storage Guide</span>
      </a>
      <nav aria-label="Main">
        <a href="#/guide/1" data-nav="guide">Put away</a>
        <a href="#/map" data-nav="map">Map</a>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap" tabindex="-1">
    <noscript><p class="notice">This guide needs JavaScript turned on to work.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="footer-text"></p>
    </div>
  </footer>

  <!--
    MAP TEMPLATE
    Top-down map, door at the bottom. Not to scale (redrawn from a hand sketch).
    Each <g id="hotspot-..."> matches a zone's "hotspot" in closet-data.js.
    app.js fills in the zone letters and makes the shapes clickable.
    Coordinates are in a 1600 x 1160 box; edit shapes freely, keep the ids.
  -->
  <template id="map-template">
    <svg class="closet-map" viewBox="0 0 1600 1160" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Top-down map of the storage room. The door is at the bottom.">
      <rect class="floor" x="10" y="10" width="1580" height="1050"/>

      <!-- Not a zone: floor boxes area from the sketch -->
      <g class="decor" aria-hidden="true">
        <rect x="1105" y="300" width="470" height="600"/>
        <text x="1340" y="600">Boxes</text>
      </g>

      <g id="hotspot-beds">
        <rect class="shape" x="935" y="10" width="655" height="285"/>
        <text class="zcode big" x="1262" y="135"></text>
        <text class="zname" x="1262" y="205">Beds</text>
      </g>

      <g id="hotspot-carts">
        <rect class="shape" x="15" y="15" width="815" height="320"/>
        <!-- row of 5 equal carts (163 units each) -->
        <line class="divider" x1="178" y1="15" x2="178" y2="335"/>
        <line class="divider" x1="341" y1="15" x2="341" y2="335"/>
        <line class="divider" x1="504" y1="15" x2="504" y2="335"/>
        <line class="divider" x1="667" y1="15" x2="667" y2="335"/>
        <!-- 6th cart, below the row, same width as the others -->
        <rect class="shape" x="15" y="350" width="163" height="185"/>
        <text class="zcode" x="96"  y="90"></text>
        <text class="zcode" x="259" y="90"></text>
        <text class="zcode" x="422" y="90"></text>
        <text class="zcode" x="585" y="90"></text>
        <text class="zcode" x="748" y="90"></text>
        <text class="zcode" x="96"  y="442"></text>
      </g>

      <g id="hotspot-stools">
        <circle class="shape" cx="96"  cy="240" r="50"/>
        <circle class="shape" cx="259" cy="240" r="50"/>
        <text class="zcode sm" x="96"  y="225"></text>
        <text class="zcode sm" x="259" y="225"></text>
        <text class="zsmall" x="96"  y="262">stool</text>
        <text class="zsmall" x="259" y="262">stool</text>
      </g>

      <g id="hotspot-trash-can">
        <rect class="shape" x="640" y="185" width="255" height="105"/>
        <text class="zcode" x="700" y="237"></text>
        <text class="zname small" x="810" y="237">Trash can</text>
      </g>

      <g id="hotspot-scales">
        <rect class="shape" x="30"  y="595" width="40"  height="90"/>
        <rect class="shape" x="315" y="540" width="40"  height="90"/>
        <rect class="shape" x="355" y="375" width="40"  height="115"/>
        <rect class="shape" x="425" y="335" width="170" height="45"/>
        <rect class="shape" x="625" y="335" width="120" height="45"/>
        <rect class="shape" x="835" y="335" width="100" height="40"/>
        <text class="zcode sm" x="50"  y="640"></text>
        <text class="zcode sm" x="335" y="585"></text>
        <text class="zcode sm" x="375" y="432"></text>
        <text class="zcode sm" x="510" y="358"></text>
        <text class="zcode sm" x="685" y="358"></text>
        <text class="zcode sm" x="885" y="355"></text>
      </g>

      <g id="hotspot-wire-cart">
        <rect class="shape" x="80" y="550" width="225" height="135"/>
        <text class="zcode" x="192" y="605"></text>
        <text class="zname" x="192" y="650">Wire cart</text>
      </g>

      <g id="hotspot-cabinets">
        <rect class="shape" x="25"  y="690" width="110" height="110"/>
        <rect class="shape" x="137" y="690" width="113" height="110"/>
        <text class="zcode" x="80"  y="745"></text>
        <text class="zcode" x="193" y="745"></text>
      </g>

      <g id="hotspot-vitals-cart">
        <rect class="shape" x="395" y="385" width="180" height="120"/>
        <text class="zcode" x="485" y="440"></text>
        <text class="zname" x="485" y="481">Vitals cart</text>
      </g>

      <g id="hotspot-yellow-boxes">
        <rect class="shape" x="375" y="525" width="200" height="370"/>
        <text class="zcode" x="475" y="690"></text>
        <text class="zname" x="475" y="740">Yellow boxes</text>
      </g>

      <g id="hotspot-printer-cart">
        <rect class="shape" x="605" y="630" width="125" height="210"/>
        <text class="zcode" x="667" y="735"></text>
      </g>

      <g id="hotspot-book-cart">
        <rect class="shape" x="715" y="415" width="95" height="205"/>
        <text class="zcode" x="762" y="518"></text>
      </g>

      <g id="hotspot-shredder">
        <rect class="shape" x="760" y="690" width="110" height="170"/>
        <text class="zcode" x="815" y="775"></text>
      </g>

      <g id="hotspot-big-whiteboard">
        <rect class="shape" x="870" y="395" width="40" height="500"/>
        <text class="zcode" x="890" y="645"></text>
      </g>

      <g id="hotspot-small-whiteboard">
        <rect class="shape" x="965" y="480" width="110" height="60"/>
        <text class="zcode" x="1020" y="510"></text>
      </g>

      <!-- Walls and door (door opening at the bottom, swing arc into the room) -->
      <path class="wall" d="M640 1060 H10 V10 H1590 V1060 H760"/>
      <path class="door" d="M640 1060 V940 M640 940 A120 120 0 0 1 760 1060"/>
      <text class="doorlabel" x="700" y="1115">DOOR</text>
    </svg>
  </template>

  <script src="closet-data.js?v=20261111"></script>
  <script src="app.js?v=20261111"></script>
</body>
</html>
