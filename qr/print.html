<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westminster Storage Guide - QR code printout</title>
<style>
  @page { size: letter portrait; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #14212e; background: #fff; }
  .page { width: 8.5in; height: 11in; padding: 0.75in; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  h1 { margin: 0 0 0.5in; font-size: 44pt; line-height: 1.1; }
  .qr { width: 5.6in; height: 5.6in; padding: 0.2in; border: 4pt solid #16507a; border-radius: 0.2in; }
  .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  @media screen { body { background: #e7edf3; } .page { margin: 0 auto; background: #fff; } }
</style>
</head>
<body>
<div class="page">
  <h1>Storage Room Guide</h1>
  <div class="qr"><img src="westminster-storage-guide-qr.svg" alt="QR code that opens the Westminster Storage Guide"></div>
</div>
</body>
</html>
